<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TradeCheck AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

.container {
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  padding: 18px;
}

.header {
  text-align: center;
  padding: 10px 0 20px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.subtitle {
  margin: 7px 0 0;
  color: #6b7280;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.card h2,
.card h3 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: 700;
  margin: 15px 0 7px;
}

select,
input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 11px;
  background: white;
  font-size: 16px;
  outline: none;
}

select:focus,
input:focus {
  border-color: #111827;
}

.search-wrap {
  position: relative;
}

.suggestions {
  margin-top: 6px;
}

.suggestion {
  width: 100%;
  border: 1px solid #e5e7eb;
  background: #f9fafb;
  color: #111827;
  padding: 12px;
  margin: 5px 0;
  border-radius: 10px;
  text-align: left;
  font-size: 15px;
  cursor: pointer;
}

.suggestion:hover {
  background: #e5e7eb;
}

.selected {
  margin-top: 12px;
}

.selected-player {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: #f3f4f6;
  border-radius: 11px;
  padding: 11px 12px;
  margin: 7px 0;
}

.player-info {
  min-width: 0;
}

.player-name {
  font-weight: 700;
}

.player-meta {
  color: #6b7280;
  font-size: 13px;
  margin-top: 3px;
}

.remove-btn {
  width: auto;
  margin: 0;
  padding: 7px 10px;
  background: #e5e7eb;
  color: #111827;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}

.analyze-btn {
  width: 100%;
  margin-top: 24px;
  padding: 17px;
  border: none;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  touch-action: manipulation;
}

.analyze-btn:hover {
  background: #000;
}

.analyze-btn:active {
  transform: scale(.99);
}

.clear-btn {
  width: 100%;
  margin-top: 9px;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 11px;
  background: white;
  color: #111827;
  font-weight: 700;
  cursor: pointer;
}

.error {
  margin-top: 15px;
  padding: 13px;
  border-radius: 10px;
  background: #fef2f2;
  color: #991b1b;
  font-weight: 700;
}

.result {
  margin-top: 20px;
}

.verdict {
  text-align: center;
  padding: 20px;
  border-radius: 15px;
  background: #f3f4f6;
}

.verdict h2 {
  margin: 0 0 8px;
  font-size: 26px;
}

.diff {
  font-size: 38px;
  font-weight: 900;
  margin: 8px 0;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 15px;
}

.score-card {
  padding: 15px;
  border-radius: 13px;
  background: #f9fafb;
  text-align: center;
}

.score-number {
  font-size: 27px;
  font-weight: 900;
  margin-top: 5px;
}

.breakdown {
  margin-top: 15px;
}

.breakdown-player {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.breakdown-player:last-child {
  border-bottom: none;
}

.small {
  color: #6b7280;
  font-size: 13px;
}

.empty {
  color: #9ca3af;
  font-size: 14px;
  padding: 8px 0;
}

@media (max-width: 600px) {
  .container {
    padding: 12px;
  }

  .card {
    padding: 16px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>TradeCheck AI 🏈</h1>
    <p class="subtitle">Fantasy Football Trade Analyzer</p>
  </div>

  <div class="card">

    <h2>League Settings</h2>

    <label for="scoring">Scoring</label>
    <select id="scoring">
      <option value="ppr">PPR</option>
      <option value="half">Half-PPR</option>
      <option value="standard">Standard</option>
    </select>

    <label for="teams">League Size</label>
    <select id="teams">
      <option value="10">10 Team</option>
      <option value="12" selected>12 Team</option>
      <option value="14">14 Team</option>
    </select>

  </div>

  <div class="card">

    <h2>You Give</h2>

    <div class="search-wrap">
      <input
        id="giveSearch"
        type="text"
        placeholder="Search for a player..."
        autocomplete="off"
      >
      <div id="giveSuggestions" class="suggestions"></div>
    </div>

    <div id="giveSelected" class="selected">
      <div class="empty">No players selected.</div>
    </div>

  </div>

  <div class="card">

    <h2>You Receive</h2>

    <div class="search-wrap">
      <input
        id="receiveSearch"
        type="text"
        placeholder="Search for a player..."
        autocomplete="off"
      >
      <div id="receiveSuggestions" class="suggestions"></div>
    </div>

    <div id="receiveSelected" class="selected">
      <div class="empty">No players selected.</div>
    </div>

  </div>

  <div class="card">

    <button id="analyzeBtn" class="analyze-btn">
      ANALYZE TRADE
    </button>

    <button id="clearBtn" class="clear-btn">
      Clear Trade
    </button>

    <div id="error"></div>

    <div id="result" class="result"></div>

  </div>

</div>


<script>

/* =========================
   PLAYER DATABASE
========================= */

const players = {

  "ceedee lamb": { value: 98, pos: "WR" },
  "ja'marr chase": { value: 99, pos: "WR" },
  "justin jefferson": { value: 97, pos: "WR" },
  "amon-ra st. brown": { value: 94, pos: "WR" },
  "nico collins": { value: 91, pos: "WR" },
  "puka nacua": { value: 95, pos: "WR" },
  "malik nabers": { value: 91, pos: "WR" },
  "garrett wilson": { value: 89, pos: "WR" },
  "aj brown": { value: 92, pos: "WR" },
  "devonta smith": { value: 83, pos: "WR" },
  "tee higgins": { value: 84, pos: "WR" },
  "mike evans": { value: 78, pos: "WR" },
  "george pickens": { value: 84, pos: "WR" },
  "marvin harrison jr": { value: 86, pos: "WR" },
  "rome odunze": { value: 80, pos: "WR" },
  "drake london": { value: 89, pos: "WR" },
  "brian thomas jr": { value: 88, pos: "WR" },
  "jsn": { value: 87, pos: "WR" },
  "jayden reed": { value: 78, pos: "WR" },
  "ladd mcconkey": { value: 80, pos: "WR" },
  "tetairoa mcmillan": { value: 83, pos: "WR" },
  "chris olave": { value: 87, pos: "WR" },
  "tyreek hill": { value: 82, pos: "WR" },
  "dk metcalf": { value: 81, pos: "WR" },
  "marvin mims": { value: 65, pos: "WR" },

  "bijan robinson": { value: 98, pos: "RB" },
  "jahmyr gibbs": { value: 97, pos: "RB" },
  "christian mccaffrey": { value: 92, pos: "RB" },
  "jonathan taylor": { value: 90, pos: "RB" },
  "saquon barkley": { value: 95, pos: "RB" },
  "derrick henry": { value: 82, pos: "RB" },
  "james cook": { value: 87, pos: "RB" },
  "ashton jeanty": { value: 90, pos: "RB" },
  "jaylen warren": { value: 76, pos: "RB" },
  "breece hall": { value: 88, pos: "RB" },
  "de'von achane": { value: 94, pos: "RB" },
  "james conner": { value: 75, pos: "RB" },
  "josh jacobs": { value: 84, pos: "RB" },
  "kenneth walker": { value: 82, pos: "RB" },
  "chase brown": { value: 80, pos: "RB" },
  "bucky irving": { value: 79, pos: "RB" },
  "treveyon henderson": { value: 82, pos: "RB" },
  "omarion hampton": { value: 85, pos: "RB" },
  "alvin kamara": { value: 79, pos: "RB" },

  "josh allen": { value: 96, pos: "QB" },
  "lamar jackson": { value: 94, pos: "QB" },
  "jalen hurts": { value: 94, pos: "QB" },
  "patrick mahomes": { value: 92, pos: "QB" },
  "joe burrow": { value: 88, pos: "QB" },
  "bo nix": { value: 78, pos: "QB" },
  "jayden daniels": { value: 86, pos: "QB" },
  "caleb williams": { value: 80, pos: "QB" },
  "cj stroud": { value: 79, pos: "QB" },
  "baker mayfield": { value: 75, pos: "QB" },
  "bryce young": { value: 68, pos: "QB" },

  "trey mcbride": { value: 91, pos: "TE" },
  "brock bowers": { value: 91, pos: "TE" },
  "george kittle": { value: 82, pos: "TE" },
  "travis kelce": { value: 78, pos: "TE" },
  "sam laporta": { value: 80, pos: "TE" },
  "harold fannin": { value: 70, pos: "TE" },
  "dalton kincaid": { value: 76, pos: "TE" },
  "tj hockenson": { value: 75, pos: "TE" },
  "evan engram": { value: 72, pos: "TE" },
  "mark andrews": { value: 76, pos: "TE" }

};


/* =========================
   TRADE STATE
========================= */

let selectedGive = [];
let selectedReceive = [];


/* =========================
   HELPER FUNCTIONS
========================= */

function titleCase(name) {
  return name.replace(/\b\w/g, letter => letter.toUpperCase());
}

function getPlayer(name) {
  return players[name] || {
    value: 50,
    pos: "?"
  };
}


/* =========================
   SEARCH
========================= */

function searchPlayers(side) {

  const input = document.getElementById(
    side === "give" ? "giveSearch" : "receiveSearch"
  );

  const suggestions = document.getElementById(
    side === "give" ? "giveSuggestions" : "receiveSuggestions"
  );

  const query = input.value.toLowerCase().trim();

  suggestions.innerHTML = "";

  if (!query) return;

  const alreadySelected =
    side === "give" ? selectedGive : selectedReceive;

  const matches = Object.keys(players)
    .filter(name =>
      name.includes(query) &&
      !alreadySelected.includes(name)
    )
    .slice(0, 8);

  matches.forEach(name => {

    const player = players[name];

    const button = document.createElement("button");

    button.type = "button";
    button.className = "suggestion";

    button.textContent =
      `${titleCase(name)} — ${player.pos} — Value ${player.value}`;

    button.addEventListener("click", function() {
      addPlayer(side, name);
    });

    suggestions.appendChild(button);

  });
}


/* =========================
   ADD PLAYER
========================= */

function addPlayer(side, name) {

  const list =
    side === "give" ? selectedGive : selectedReceive;

  if (!list.includes(name)) {
    list.push(name);
  }

  document.getElementById(
    side === "give" ? "giveSearch" : "receiveSearch"
  ).value = "";

  document.getElementById(
    side === "give" ? "giveSuggestions" : "receiveSuggestions"
  ).innerHTML = "";

  updateSelectedPlayers();
}


/* =========================
   REMOVE PLAYER
========================= */

function removePlayer(side, index) {

  if (side === "give") {
    selectedGive.splice(index, 1);
  } else {
    selectedReceive.splice(index, 1);
  }

  updateSelectedPlayers();
}


/* =========================
   DISPLAY SELECTED PLAYERS
========================= */

function updateSelectedPlayers() {

  renderSelected(
    "giveSelected",
    selectedGive,
    "give"
  );

  renderSelected(
    "receiveSelected",
    selectedReceive,
    "receive"
  );
}


function renderSelected(elementId, list, side) {

  const container = document.getElementById(elementId);

  if (list.length === 0) {
    container.innerHTML =
      '<div class="empty">No players selected.</div>';
    return;
  }

  container.innerHTML = "";

  list.forEach((name, index) => {

    const player = getPlayer(name);

    const row = document.createElement("div");
    row.className = "selected-player";

    row.innerHTML = `
      <div class="player-info">
        <div class="player-name">${titleCase(name)}</div>
        <div class="player-meta">
          ${player.pos} • Trade Value ${player.value}
        </div>
      </div>

      <button
        type="button"
        class="remove-btn"
        onclick="removePlayer('${side}', ${index})"
      >
        Remove
      </button>
    `;

    container.appendChild(row);

  });
}


/* =========================
   VALUE CALCULATION
========================= */

function calculatePlayerValue(name, scoring, teams) {

  const player = getPlayer(name);

  let value = player.value;

  /*
    Scoring adjustments
  */

  if (scoring === "ppr") {

    if (player.pos === "WR") value += 2;
    if (player.pos === "RB") value += 1;
    if (player.pos === "TE") value += 1;

  }

  if (scoring === "standard") {

    if (player.pos === "WR") value -= 2;
    if (player.pos === "RB") value -= 1;

  }

  /*
    League-size adjustment
  */

  if (teams === "10") {
    value -= 2;
  }

  if (teams === "14") {
    value += 3;
  }

  return value;
}


function calculateTotal(list, scoring, teams) {

  return list.reduce(
    (total, name) =>
      total + calculatePlayerValue(name, scoring, teams),
    0
  );

}


/* =========================
   TRADE ANALYSIS
========================= */

function analyze() {

  const error = document.getElementById("error");
  const result = document.getElementById("result");

  error.innerHTML = "";
  result.innerHTML = "";

  if (
    selectedGive.length === 0 ||
    selectedReceive.length === 0
  ) {

    error.innerHTML =
      '<div class="error">Select at least one player on both sides.</div>';

    return;
  }

  const scoring =
    document.getElementById("scoring").value;

  const teams =
    document.getElementById("teams").value;

  const giveScore =
    calculateTotal(
      selectedGive,
      scoring,
      teams
    );

  const receiveScore =
    calculateTotal(
      selectedReceive,
      scoring,
      teams
    );

  const difference =
    receiveScore - giveScore;

  let verdict;
  let explanation;

  if (difference >= 15) {

    verdict = "🔥 Major Value Gain";
    explanation =
      "You are receiving substantially more trade value.";

  } else if (difference >= 7) {

    verdict = "🔥 Strong Value Gain";
    explanation =
      "You are receiving noticeably more value.";

  } else if (difference >= 3) {

    verdict = "✅ Slight Value Gain";
    explanation =
      "You are receiving somewhat more value.";

  } else if (difference > -3) {

    verdict = "⚖️ Very Close Trade";
    explanation =
      "The overall values are extremely close.";

  } else if (difference > -7) {

    verdict = "⚠️ Slight Value Loss";
    explanation =
      "You are giving up somewhat more value.";

  } else if (difference > -15) {

    verdict = "⚠️ Significant Value Loss";
    explanation =
      "You are giving up noticeably more value.";

  } else {

    verdict = "❌ Major Value Loss";
    explanation =
      "You are giving up substantially more trade value.";

  }

  const differenceDisplay =
    difference > 0
      ? `+${difference}`
      : difference;

  result.innerHTML = `

    <div class="verdict">

      <h2>${verdict}</h2>

      <p>${explanation}</p>

      <div class="diff">
        ${differenceDisplay}
      </div>

      <div class="small">
        Trade value difference
      </div>

    </div>

    <div class="grid">

      <div class="score-card">

        <div class="small">
          YOU GIVE
        </div>

        <div class="score-number">
          ${giveScore}
        </div>

      </div>

      <div class="score-card">

        <div class="small">
          YOU RECEIVE
        </div>

        <div class="score-number">
          ${receiveScore}
        </div>

      </div>

    </div>

    <div class="card breakdown">

      <h3>You Give</h3>

      ${createBreakdown(selectedGive, scoring, teams)}

    </div>

    <div class="card breakdown">

      <h3>You Receive</h3>

      ${createBreakdown(selectedReceive, scoring, teams)}

    </div>

    <p class="small">
      ${scoring.toUpperCase()} • ${teams}-team league
    </p>

    <p class="small">
      Trade values are estimates and should be combined with roster
      construction, positional depth, starting requirements, and player
      projections.
    </p>
  `;
}


/* =========================
   BREAKDOWN
========================= */

function createBreakdown(list, scoring, teams) {

  return list.map(name => {

    const player = getPlayer(name);

    const value =
      calculatePlayerValue(
        name,
        scoring,
        teams
      );

    return `
      <div class="breakdown-player">

        <div>
          <strong>${titleCase(name)}</strong>
          <div class="small">
            ${player.pos}
          </div>
        </div>

        <strong>${value}</strong>

      </div>
    `;

  }).join("");

}


/* =========================
   CLEAR TRADE
========================= */

function clearTrade() {

  selectedGive = [];
  selectedReceive = [];

  document.getElementById("giveSearch").value = "";
  document.getElementById("receiveSearch").value = "";

  document.getElementById("giveSuggestions").innerHTML = "";
  document.getElementById("receiveSuggestions").innerHTML = "";

  document.getElementById("error").innerHTML = "";
  document.getElementById("result").innerHTML = "";

  updateSelectedPlayers();
}


/* =========================
   EVENT LISTENERS
========================= */

document
  .getElementById("giveSearch")
  .addEventListener("input", function() {
    searchPlayers("give");
  });

document
  .getElementById("receiveSearch")
  .addEventListener("input", function() {
    searchPlayers("receive");
  });

/*
  THIS IS THE IMPORTANT PART:
  The Analyze button is explicitly connected
  to the analyze() function.
*/

document
  .getElementById("analyzeBtn")
  .addEventListener("click", function(event) {

    event.preventDefault();

    analyze();

  });


document
  .getElementById("clearBtn")
  .addEventListener("click", function(event) {

    event.preventDefault();

    clearTrade();

  });


/* Initial display */

updateSelectedPlayers();

</script>

</body>
</html>
